spring:
  application:
    name: delivery
  config:
    import: "file:./.env[.properties]"

  # DB 연결 — 3-3의 docker run 값과 똑같이
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  #JWT
jwt:
  secret-key: ${JWT_SECRET_KEY}